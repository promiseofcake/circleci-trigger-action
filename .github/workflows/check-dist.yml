# We need to make sure the checked-in `dist/index.js` actually matches what we expect it to be.
name: check dist/

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: Check for non-doc changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            src:
              - '!**.md'
      - name: Set Node.js 22.x
        if: steps.filter.outputs.src == 'true'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.x
      - name: Install dependencies
        if: steps.filter.outputs.src == 'true'
        run: npm ci
      - name: Rebuild the dist/ directory
        if: steps.filter.outputs.src == 'true'
        run: npm run prepare
      - name: Verify or auto-fix dist/
        if: steps.filter.outputs.src == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$(git diff --ignore-space-at-eol dist/)" ]; then
            echo "dist/ up to date"
            exit 0
          fi
          if [ -n "$GH_PAT" ] && [ -n "${{ github.head_ref }}" ]; then
            git config user.name "Lucas Kacher"
            git config user.email "1462322+promiseofcake@users.noreply.github.com"
            git add dist/
            git commit -m "rebuild dist"
            git push "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git" HEAD:"${{ github.head_ref }}"
          else
            echo "::error::dist/ is out of date. Comment /rebuild on this PR to regenerate and push it."
            git diff dist/
            exit 1
          fi
